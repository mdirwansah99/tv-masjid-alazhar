name: Bina & Terbitkan HaierShield APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kod
      uses: actions/checkout@v4

    - name: Pasang Java 17 (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Bersihkan Line Endings gradlew
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Bina Debug APK
      id: gradle_build
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Ringkasan Log ke GitHub Summary
      if: always()
      run: |
        echo "### Log Binaan Gradle" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        tail -n 80 build.log >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Salin APK untuk Edaran
      run: |
        mkdir -p dist
        find app/build/outputs/ -name "*.apk" -exec cp {} dist/HaierShield.apk \;
        ls -la dist/

    - name: Muat Naik Artifak APK
      uses: actions/upload-artifact@v4
      with:
        name: HaierShield-APK
        path: dist/HaierShield.apk
        retention-days: 30

    - name: Cipta / Kemaskini GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: haiershield-latest
        name: "HaierShield Android TV APK (Versi Terkini)"
        body: |
          ### 🛡️ HaierShield — Penyekat Iklan TV Haier Android

          **Muat Turun & Pasang Terus pada TV:**
          1. Buka pelayar web (Browser) pada TV Haier masjid anda.
          2. Masukkan pautan:
             `https://github.com/mdirwansah99/tv-masjid-alazhar/releases/download/haiershield-latest/HaierShield.apk`
          3. Pasang APK dan ikuti arahan setup (aktifkan Kebenaran Kebolehcapaian & VPN).

          **Ciri-ciri Utama:**
          - ⚡ **Auto-Tutup Pop-up Iklan Haier** (Accessibility Service)
          - 🌐 **Penyekat Domain Iklan Tempatan** (Local DNS VPN)
          - 🔔 **Pembersih Notifikasi Iklan** (Notification Listener)
          - 🔄 **Mula Automatik Semula Apabila TV Dihidupkan** (Boot Receiver)
        files: dist/HaierShield.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
