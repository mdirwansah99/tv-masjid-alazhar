name: Bina & Terbitkan HaierShield APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kod
      uses: actions/checkout@v4

    - name: Pasang Java 17 (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Bersihkan Line Endings gradlew
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    - name: Bina Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Papar Log Jika Gagal
      if: failure()
      run: |
        echo "=== 50 BARIS TERAKHIR LOG BINAAN ==="
        tail -n 50 build.log

    - name: Sediakan Folder Edaran
      if: always()
      run: |
        mkdir -p dist
        if [ -d "app/build/outputs" ]; then
          find app/build/outputs/ -name "*.apk" -exec cp {} dist/HaierShield.apk \;
        fi
        cp build.log dist/build_log.txt

    - name: Muat Naik Artifak
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: HaierShield-Build-Files
        path: dist/
        retention-days: 30

    - name: Terbitkan ke GitHub Release
      if: always()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: haiershield-latest
        name: "HaierShield Android TV APK (Versi Terkini)"
        body: |
          ### 🛡️ HaierShield — Penyekat Iklan TV Haier Android

          **Muat Turun APK Terus ke TV:**
          Muat turun fail `HaierShield.apk` di bawah dan pasang pada TV anda.
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
